version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tree-sitter:
        patterns: ["tree-sitter*"]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /editors/zed
    schedule:
      interval: weekly
