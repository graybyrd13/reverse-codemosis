name: Bug
description: Something else does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands and a minimal project. `codemosis --log debug ...` output helps.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: codemosis doctor
      render: text
