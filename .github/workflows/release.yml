name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # build provenance attestations
  attestations: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="codemosis-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin=target/${{ matrix.target }}/release/codemosis
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: codemosis-*.${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: codemosis-*.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Software bill of materials (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --override-filename codemosis-sbom
          find . -name 'codemosis-sbom.json' -not -path './dist/*' -exec cp {} dist/codemosis-${GITHUB_REF_NAME}.cdx.json \; -quit
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "$GITHUB_REF_NAME"
