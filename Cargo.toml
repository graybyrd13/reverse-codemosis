[workspace]
resolver = "2"
members = ["crates/codemosis-core", "crates/codemosis-engine", "crates/codemosis-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/graybyrd13/reverse-codemosis"
authors = ["Reverse Codemosis contributors"]

[workspace.dependencies]
codemosis-core = { path = "crates/codemosis-core", version = "0.1.0" }
codemosis-engine = { path = "crates/codemosis-engine", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
toml = { version = "0.9", features = ["preserve_order"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
tree-sitter-lua = "0.5"
tree-sitter-swift = "0.7"
yaml-rust2 = "0.13"

[profile.dev.package."*"]
opt-level = 2
