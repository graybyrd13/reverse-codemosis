id = "exec-statement"
title = "Python 2 exec statement"
category = "broken"
semantics = "repaired"
summary = "`${stmt}` is a Python 2 exec statement; Python 3 does not compile it."
explain = """
Python 3 made exec a function: `exec code` is `exec(code)`, and the
statement form is a syntax error. With a single operand both forms run the
code in the current scope, so the call is the only repair. The forms with
`in globals, locals` are left alone, because Python 2 also accepted a tuple
operand there and the translation depends on which was meant.
"""
shape = "(exec_statement code: (_) @code) @stmt"
where = ["count(children(@stmt)) == 1"]

[fix]
edits = [{ replace = "@stmt", with = "exec(${code})" }]

[[example]]
before = '''
exec "print(40 + 2)"
'''
after = '''
exec("print(40 + 2)")
'''
output = "42\n"

[[counterexample]]
code = '''
exec("print(1)")
'''
