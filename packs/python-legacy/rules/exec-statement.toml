id = "exec-statement"
title = "Python 2 exec statement"
category = "broken"
semantics = "repaired"
summary = "`${stmt}` is a Python 2 exec statement; Python 3 does not compile it."
explain = """
Python 3 made exec a function: `exec code` is `exec(code)`. The forms with
`in globals, locals` are left alone.
"""
shape = "(exec_statement code: (_) @code) @stmt"
where = ["count(children(@stmt)) == 1"]

[fix]
edits = [{ replace = "@stmt", with = "exec(${code})" }]

[[example]]
before = '''
exec "print(40 + 2)"
'''
after = '''
exec("print(40 + 2)")
'''
output = "42\n"

[[counterexample]]
code = '''
exec("print(1)")
'''
