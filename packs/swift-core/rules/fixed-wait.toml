id = "fixed-wait"
title = "Fixed wait"
tags = ["timing", "flaky-tests"]
category = "hazard"
semantics = "preserved"
summary = "`${stmt}` pauses for a fixed time instead of waiting for what the code actually needs."
explain = """
A fixed sleep is a guess about timing: too short and the code is flaky (what it waited for is not ready yet), too long and every run is slow. The safe form waits for the condition itself: poll it with a timeout, wait for the process or the event.

Some waits are deliberate (rate limits, back-off, pacing), so the engine asks. keep records the wait as intentional; remove deletes it. Waits inside loops are polling intervals and are not reported.

Examples, documentation and benchmarks are left alone (see `file_purpose()`): a pause there is part of the demonstration.
"""
shape = '''
(call_expression
  (simple_identifier) @function
  (call_suffix)
  (#any-of? @function "sleep" "usleep")) @stmt

(call_expression
  (navigation_expression
    target: (simple_identifier) @class
    suffix: (navigation_suffix suffix: (simple_identifier) @method))
  (call_suffix)
  (#eq? @class "Thread")
  (#eq? @method "sleep")) @stmt

(try_expression
  expr: (await_expression
    expr: (call_expression
      (navigation_expression
        target: (simple_identifier) @class
        suffix: (navigation_suffix suffix: (simple_identifier) @method))
      (call_suffix)))
  (#eq? @class "Task")
  (#eq? @method "sleep")) @stmt
'''
focus = "@stmt"
where = [
  "file_purpose() not in ['example', 'docs', 'benchmark']",
  "kind(parent(@stmt)) == 'statements'",
  "!inside(@stmt, 'for_statement', 'while_statement', 'repeat_while_statement', 'lambda_literal')",
  "occupies_lines(@stmt)",
]

[ask]
question = "Keep this fixed wait?"

[[ask.option]]
answer = "keep"
means = "the wait is deliberate (rate limit, back-off, pacing); record it as intentional"

[[ask.option]]
answer = "remove"
means = "delete it; if something must be ready first, wait for that condition instead"
edits = [{ delete_lines = "@stmt" }]

[[example]]
answer = "remove"
before = '''
func refresh() async throws {
    print("refreshing")
    try await Task.sleep(nanoseconds: 1_000_000)
    print("refreshed")
}
'''
after = '''
func refresh() async throws {
    print("refreshing")
    print("refreshed")
}
'''

[[counterexample]]
code = '''
func waitReady() {
    while !ready() {
        sleep(1)
    }
}
'''

[[counterexample]]
name = "the same wait in an example: pausing there is usually the point"
path = "examples/demo.swift"
code = '''
func refresh() async throws {
    print("refreshing")
    try await Task.sleep(nanoseconds: 1_000_000)
    print("refreshed")
}
'''

[[counterexample]]
name = "a wait whose value is bound: deleting the line would delete the binding"
code = '''
import Foundation
func pause() {
    let left = sleep(1)
    print(left)
}
'''

[[counterexample]]
name = "a wait that shares its line"
code = '''
import Foundation
func flush() {}
func settle() { flush(); sleep(1) }
'''

[[counterexample]]
name = "a wait on its own line as an argument: deleting the line would break the call"
code = '''
import Foundation
func pause() {
    print(
        sleep(1)
    )
}
'''
