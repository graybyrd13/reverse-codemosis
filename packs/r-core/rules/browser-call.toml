id = "browser-call"
title = "browser() left in code"
tags = ["debugging"]
category = "waste"
semantics = "preserved"
summary = "`${call}` stops the program in the debugger."
explain = """
`browser()` pauses an interactive session in the debugger; it is how R code is debugged, and it is easy to
leave behind. The engine asks: keep records it as intentional; remove deletes the line.
"""
shape = '''
(call function: (identifier) @function arguments: (arguments) (#eq? @function "browser")) @call
'''
focus = "@call"
where = [
  "kind(parent(@call)) in ['braced_expression', 'program']",
  "occupies_lines(@call)",
  "!r.defines('browser')",
]
[ask]
question = "Keep this browser() call?"

[[ask.option]]
answer = "keep"
means = "it is deliberate; record it as intentional"

[[ask.option]]
answer = "remove"
means = "it is leftover debugging; delete it"
edits = [{ delete_lines = "@call" }]

[[example]]
answer = "remove"
before = '''
total <- function(x) {
  browser()
  sum(x)
}
'''
after = '''
total <- function(x) {
  sum(x)
}
'''

[[counterexample]]
name = "the body of an if: deleting the line would change what the if guards"
code = '''
total <- function(x, debug) {
  if (debug)
    browser()
  sum(x)
}
'''

[[counterexample]]
name = "a call that shares its line"
code = '''
total <- function(x) {
  browser(); sum(x)
}
'''

[[counterexample]]
name = "browser is defined here"
code = '''
browser <- function() message("open the report")
show <- function() {
  browser()
  invisible(NULL)
}
'''
