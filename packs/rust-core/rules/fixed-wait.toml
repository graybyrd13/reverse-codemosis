id = "fixed-wait"
title = "Fixed wait"
tags = ["timing", "flaky-tests"]
category = "hazard"
semantics = "preserved"
summary = "`${call}` pauses for a fixed time instead of waiting for what the code actually needs."
explain = """
A fixed sleep is a guess about timing: too short and the code is flaky, too
long and it is slow on every run. The safe form waits for the condition
itself (join the thread, await the future or channel, poll with a timeout).

Some waits are deliberate: rate limits, back-off, pacing. Only you know, so
the engine asks. keep records the wait as intentional; remove deletes it.
Waits inside loops and closures are not reported.

Examples, documentation and benchmarks are left alone (see `file_purpose()`): a pause there is part of the demonstration.
"""
shape = '''
(expression_statement
  (call_expression function: (scoped_identifier) @function) @call) @stmt

(expression_statement
  (await_expression (call_expression function: (scoped_identifier) @function)) @call) @stmt
'''
focus = "@stmt"
where = [
  "file_purpose() not in ['example', 'docs', 'benchmark']",
  "matches(text(@function), '^((std::)?thread::sleep|(tokio::)?time::sleep|async_std::task::sleep)$')",
  "!inside(@stmt, 'loop_expression', 'while_expression', 'for_expression', 'closure_expression')",
  "occupies_lines(@stmt)",
]

[ask]
question = "Keep this fixed wait?"

[[ask.option]]
answer = "keep"
means = "the wait is deliberate (rate limit, back-off, pacing); record it as intentional"

[[ask.option]]
answer = "remove"
means = "delete it; if something must be ready first, wait for that condition instead"
edits = [{ delete_lines = "@stmt" }]

[[example]]
answer = "remove"
before = '''
use std::time::Duration;

fn main() {
    println!("started");
    std::thread::sleep(Duration::from_millis(5));
    println!("finished");
}
'''
after = '''
use std::time::Duration;

fn main() {
    println!("started");
    println!("finished");
}
'''

[[counterexample]]
name = "a polling interval inside a loop"
code = '''
use std::time::Duration;

fn wait(ready: impl Fn() -> bool) {
    while !ready() {
        std::thread::sleep(Duration::from_millis(10));
    }
}
'''
