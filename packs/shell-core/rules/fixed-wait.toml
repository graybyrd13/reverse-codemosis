id = "fixed-wait"
title = "Fixed wait"
tags = ["timing", "flaky-tests"]
category = "hazard"
semantics = "preserved"
summary = "`${stmt}` pauses for a fixed time instead of waiting for what the script actually needs."
explain = """
A fixed sleep is a guess about timing: too short and the code is flaky (what it waited for is not ready yet), too long and every run is slow. The safe form waits for the condition itself: poll it with a timeout, wait for the process or the event.

Some waits are deliberate (rate limits, back-off, pacing), so the engine asks. keep records the wait as intentional; remove deletes it. Waits inside loops are polling intervals and are not reported.

In scripts the usual safe form is a loop that checks the condition (the port
answers, the file exists, the process is up) with a time limit.

Examples, documentation and benchmarks are left alone (see `file_purpose()`): a pause there is part of the demonstration.
"""
shape = '''
(command
  name: (command_name (word) @command)
  argument: [(number) (word)] @_delay
  (#eq? @command "sleep")) @stmt
'''
focus = "@stmt"
where = [
  "file_purpose() not in ['example', 'docs', 'benchmark']",
  "count(field(@stmt, 'argument')) == 1",
  "kind(parent(@stmt)) == 'program' || (kind(parent(@stmt)) == 'compound_statement' && count(children(parent(@stmt))) > 1)",
  "!inside(@stmt, 'for_statement', 'while_statement', 'c_style_for_statement')",
  "occupies_lines(@stmt)",
]

[ask]
question = "Keep this fixed wait?"

[[ask.option]]
answer = "keep"
means = "the wait is deliberate (rate limit, back-off, pacing); record it as intentional"

[[ask.option]]
answer = "remove"
means = "delete it; if something must be ready first, wait for that condition instead"
edits = [{ delete_lines = "@stmt" }]

[[example]]
answer = "remove"
before = '''
echo "starting the server"
sleep 0.01
echo "server started"
'''
after = '''
echo "starting the server"
echo "server started"
'''

[[counterexample]]
name = "a polling loop"
code = '''
until curl -s localhost:8080 >/dev/null; do
  sleep 1
done
'''

[[counterexample]]
name = "the same wait in an example: pausing there is usually the point"
path = "examples/demo.sh"
code = '''
echo "starting the server"
sleep 0.01
echo "server started"
'''

[[counterexample]]
name = "several durations"
code = '''
#!/bin/bash
sleep 1m 30s
'''

[[counterexample]]
name = "a wait chained to another command: deleting the line would delete both"
code = '''
#!/bin/bash
sleep 2 && echo done
'''

[[counterexample]]
name = "a wait inside a loop"
code = '''
#!/bin/bash
while ! ready; do
  {
    echo waiting
    sleep 1
  }
done
'''

[[counterexample]]
name = "a wait that shares its line"
code = '''
#!/bin/bash
echo start; sleep 1
echo end
'''

[[counterexample]]
name = "the only command of a then branch: deleting it would leave the if empty"
code = '''
#!/bin/bash
if [ -n "$SLOW" ]; then
  sleep 1
fi
'''
