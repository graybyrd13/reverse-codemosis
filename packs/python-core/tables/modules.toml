# Names that exactly one standard-library module exports, mapped to it.
# A name that two modules export (typing.Callable and collections.abc.Callable,
# time.sleep and asyncio.sleep, typing.Counter and collections.Counter) is
# ambiguous and must not appear here: importing either would be a guess.
[stdlib_names]
ABC = "abc"
abstractmethod = "abc"
Any = "typing"
ClassVar = "typing"
contextmanager = "contextlib"
dataclass = "dataclasses"
asdict = "dataclasses"
Decimal = "decimal"
deepcopy = "copy"
DefaultDict = "typing"
defaultdict = "collections"
deque = "collections"
