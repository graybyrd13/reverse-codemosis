# Facts about the Python standard library that rules rely on.
#
# Every entry is a claim the engine trusts, so every entry must be exact.
# Leaving something out is always safe: it only means fewer corrections.

# Modules whose import has no observable effect beyond defining names.
# Removing an unused import of one of these cannot change behaviour.
side_effect_free_modules = [
  "abc", "argparse", "array", "base64", "bisect", "calendar", "collections",
  "contextlib", "copy", "csv", "dataclasses", "datetime", "decimal", "enum",
  "fnmatch", "fractions", "functools", "glob", "hashlib", "heapq", "hmac",
  "inspect", "io", "itertools", "json", "logging", "math", "operator", "os",
  "os.path", "pathlib", "pprint", "random", "re", "secrets", "shlex", "shutil",
  "statistics", "string", "struct", "subprocess", "sys", "tempfile", "textwrap",
  "time", "traceback", "types", "typing", "uuid", "zlib",
]

# Standard-library modules and the attributes the code may read from them
# after a plain `import module`. Submodules that need their own import
# (logging.handlers, collections.abc, xml.etree...) are deliberately absent.
[stdlib_modules]
base64 = ["a85decode", "a85encode", "b16decode", "b16encode", "b32decode", "b32encode", "b64decode", "b64encode", "b85decode", "b85encode", "decodebytes", "encodebytes", "standard_b64decode", "standard_b64encode", "urlsafe_b64decode", "urlsafe_b64encode"]
