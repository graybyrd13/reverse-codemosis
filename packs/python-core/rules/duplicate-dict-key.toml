id = "duplicate-dict-key"
title = "Dictionary key given twice"
category = "contradiction"
cwe = ["CWE-462"]
summary = "Key ${second} appears twice in this dictionary; the value given on line ${first|line} is silently discarded."
explain = """
In a dictionary literal, a repeated key keeps only its last value: the
earlier entry is evaluated and then thrown away. Either one of the keys is a
typo for a different key, or one of the entries is stale. Which one is a
question about intent, so nothing is changed: decide which entry is right
and delete or rename the other.
"""
# Each entry is matched once and compared with the entries before it: a
# shape pairing every entry with every other would be quadratic in the size
# of the dictionary.
shape = "(dictionary (pair key: (_) @second) @pair)"
focus = "@second"
where = [
  "exists(@first)",
  "kind(@first) in ['string', 'integer', 'float', 'true', 'false', 'none']",
  "!contains(@first, 'interpolation')",
]

[let]
first = "earlier_same_field(@pair, 'key')"

[[evidence]]
at = "@first"
label = "first given here; this value is discarded"

[[example]]
before = '''
PRICES = {
    "apple": 0.5,
    "pear": 0.75,
    "apple": 0.6,
}
'''

[[counterexample]]
name = "distinct keys"
code = '''
PRICES = {"apple": 0.5, "pear": 0.75}
'''

[[counterexample]]
name = "computed keys may differ at run time"
code = '''
counter = iter(range(10))
d = {next(counter): "a", next(counter): "b"}
'''
