id = "fixed-wait"
title = "Fixed wait"
tags = ["timing", "flaky-tests"]
category = "hazard"
semantics = "preserved"
summary = "`${call}` pauses for a fixed time instead of waiting for what the code actually needs."
explain = """
`await new Promise(r => setTimeout(r, ms))`, `page.waitForTimeout(ms)` and
`cy.wait(ms)` are guesses about timing: too short and tests are flaky, too
long and every run is slow. The safe form waits for the thing itself: await
the promise that produces it, or use the test framework's waiting assertions
(`await expect(locator).toBeVisible()`, `cy.get(...).should(...)`).

Some waits are deliberate (rate limits, back-off, animation pacing), so the
engine asks. keep records the wait as intentional; remove deletes it. Waits
inside loops are polling intervals and are not reported.
"""
shape = '''
(expression_statement
  (await_expression
    (new_expression
      constructor: (identifier) @promise
      arguments: (arguments
        (arrow_function
          parameter: (identifier) @resolve
          body: (call_expression
            function: (identifier) @timer
            arguments: (arguments . (identifier) @callback . (_) @delay .)))))) @call
  (#eq? @promise "Promise")
  (#eq? @timer "setTimeout")
  (#eq? @resolve @callback)) @stmt

(expression_statement
  (await_expression
    (new_expression
      constructor: (identifier) @promise
      arguments: (arguments
        (arrow_function
          parameters: (formal_parameters . (_) @resolve .)
          body: (call_expression
            function: (identifier) @timer
            arguments: (arguments . (identifier) @callback . (_) @delay .)))))) @call
  (#eq? @promise "Promise")
  (#eq? @timer "setTimeout")
  (#eq? @resolve @callback)) @stmt

(expression_statement
  (await_expression
    (call_expression
      function: (member_expression property: (property_identifier) @method)
      arguments: (arguments . (number) @delay .))) @call
  (#any-of? @method "waitForTimeout" "pause")) @stmt

(expression_statement
  (call_expression
    function: (member_expression object: (identifier) @object property: (property_identifier) @method)
    arguments: (arguments . (number) @delay .)) @call
  (#eq? @object "cy")
  (#eq? @method "wait")) @stmt

(expression_statement
  (await_expression
    (call_expression
      function: (identifier) @helper
      arguments: (arguments . (number) @delay .))) @call
  (#any-of? @helper "sleep" "delay" "wait" "pause")) @stmt
'''
focus = "@stmt"
where = [
  "!inside(@stmt, 'for_statement', 'for_in_statement', 'while_statement', 'do_statement')",
  "occupies_lines(@stmt)",
]

[ask]
question = "Keep this fixed wait?"

[[ask.option]]
answer = "keep"
means = "the wait is deliberate (rate limit, back-off, pacing); record it as intentional"

[[ask.option]]
answer = "remove"
means = "delete it; if something must be ready first, wait for that condition instead"
edits = [{ delete_lines = "@stmt" }]

[[example]]
name = "a setTimeout promise"
answer = "remove"
before = '''
async function checkout(cart) {
  console.log("charging", cart.total);
  await new Promise((resolve) => setTimeout(resolve, 20));
  console.log("charged");
}

await checkout({ total: 42 });
'''
after = '''
async function checkout(cart) {
  console.log("charging", cart.total);
  console.log("charged");
}

await checkout({ total: 42 });
'''

[[example]]
name = "in TypeScript, kept"
language = "typescript"
answer = "keep"
before = '''
async function poll(): Promise<void> {
  await new Promise(r => setTimeout(r, 10));
  console.log("polled");
}
await poll();
'''
after = '''
async function poll(): Promise<void> {
  await new Promise(r => setTimeout(r, 10));
  console.log("polled");
}
await poll();
'''

[[counterexample]]
name = "a polling loop"
code = '''
async function waitFor(ready) {
  while (!ready()) {
    await new Promise((r) => setTimeout(r, 50));
  }
}
'''

[[counterexample]]
name = "a deferred callback is not a wait"
code = '''
setTimeout(() => console.log("later"), 1000);
'''
