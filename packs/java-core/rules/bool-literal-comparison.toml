id = "bool-literal-comparison"
title = "Comparison with true or false"
category = "simplification"
semantics = "preserved"
summary = "`${cmp}` compares a boolean with a constant; it is `${result}`."
explain = """
Java only lets `boolean` and `Boolean` values be compared with `true` and
`false`, so `x == true` is exactly `x` and `x == false` is exactly `!x` (a
null Boolean throws in both forms, the same way).
"""
shape = '''
(binary_expression
  left: (_) @value
  operator: ["==" "!="] @op
  right: [(true) (false)] @literal) @cmp

(binary_expression
  left: [(true) (false)] @literal
  operator: ["==" "!="] @op
  right: (_) @value) @cmp
'''
focus = "@cmp"
where = ["kind(@value) not in ['true', 'false']"]

[let]
same = "(text(@op) == '==') == (text(@literal) == 'true')"
result = "choose(@same, text(@value), bang(text(@value)))"

[fix]
edits = [{ replace = "@cmp", with = "${result}" }]

[[example]]
before = '''
public class Snippet {
    public static void main(String[] args) {
        boolean ready = args.length == 0;
        if (ready == true) System.out.println("ready");
        if (ready == false) System.out.println("not ready");
    }
}
'''
after = '''
public class Snippet {
    public static void main(String[] args) {
        boolean ready = args.length == 0;
        if (ready) System.out.println("ready");
        if (!ready) System.out.println("not ready");
    }
}
'''

[[counterexample]]
code = '''
public class Snippet {
    static boolean same(int a, int b) { return a == b; }
}
'''

[[counterexample]]
name = "two literals: there is no expression to keep"
code = '''
public class Snippet {
    static final boolean NEVER = true == false;
}
'''
